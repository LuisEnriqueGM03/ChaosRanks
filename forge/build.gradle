plugins { id 'net.minecraftforge.gradle' version '7.0.34' }
apply from: rootProject.file('gradle/loader.gradle')
minecraft {
 runs {
  configureEach { workingDir = layout.projectDirectory.dir('run-26.2'); args '--mixin.config', 'chaosranks.mixins.json' }
  register('client') { if (project.hasProperty('selftest')) systemProperty 'chaosranks.selftest','true'; if (project.hasProperty('selftestSmall')) { systemProperty 'chaosranks.selftest','true'; systemProperty 'chaosranks.selftest.small','true'; args '--width','1024','--height','768' } }
  register('server') { args '--nogui' }
 }
}
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies { implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}") }
jar { manifest { attributes('MixinConfigs':'chaosranks.mixins.json') } }

processResources { filesMatching('chaosranks.mixins.json') { filter { line -> line.replace('JAVA_25','JAVA_21') } } }