apply plugin: 'java-library'
base.archivesName = "chaosranks-${project.name}-${minecraft_version}"
java {
 toolchain.languageVersion = JavaLanguageVersion.of(21)
 withSourcesJar()
}
repositories {
 mavenCentral()
 maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
}
sourceSets.main {
 java.srcDir '../common/src/main/java'
 resources.srcDir '../common/src/main/resources'
}
sourceSets.test.java.srcDir '../common/src/test/java'
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
dependencies { compileOnly 'org.jetbrains:annotations:24.1.0' }
processResources {
 def props = [version: version, minecraft_version: minecraft_version]
 inputs.properties(props)
 filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) { expand props }
}
jar { from(rootProject.file('LICENSE')) }
tasks.register('regressionTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'com.chaos.ranks.RegressionTests'
 workingDir = layout.buildDirectory.dir('regression-work').get().asFile
 doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn regressionTest }
tasks.named('test') { task ->
 if (org.gradle.util.GradleVersion.current() >= org.gradle.util.GradleVersion.version('9.0')) task.failOnNoDiscoveredTests = false
}
