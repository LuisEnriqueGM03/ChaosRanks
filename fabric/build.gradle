plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
apply from: rootProject.file('gradle/loader.gradle')
dependencies {
 minecraft "com.mojang:minecraft:${minecraft_version}"
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:${loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
loom {
 runs {
  selftestSmall { client(); runDir '../run-1.21.4-small'; vmArg '-Dchaosranks.selftest=true'; vmArg '-Dchaosranks.selftest.small=true'; programArgs '--width', '1024', '--height', '768' }
  selftest { client(); runDir '../run-1.21.4'; vmArg '-Dchaosranks.selftest=true' }
 }
}
