plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

loom {
	mods {
		"chaosranks" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// Autoprueba visual: ./gradlew runSelftest (necesita run/saves/selftest).
		selftestSmall {
   client()
   name "Self Test Small Viewport"
   programArgs "--quickPlaySingleplayer", "selftest", "--width", "1024", "--height", "768"
   vmArg "-Dchaosranks.selftest=true"
   vmArg "-Dchaosranks.selftest.small=true"
  }
		selftest {
			client()
			name "Self Test"
			programArgs "--quickPlaySingleplayer", "selftest"
			vmArg "-Dchaosranks.selftest=true"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Regression suite uses the existing Minecraft runtime, without extra test libraries.
tasks.register('regressionTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'com.chaos.ranks.RegressionTests'
 workingDir = layout.buildDirectory.dir('regression-work').get().asFile
 doFirst { workingDir.mkdirs() }
}
tasks.named('check') { dependsOn regressionTest }
tasks.named('jar') { from('LICENSE') }

// The executable suite above supplies the tests; retain discovery for future JUnit tests.
tasks.named('test') { failOnNoDiscoveredTests = false }
